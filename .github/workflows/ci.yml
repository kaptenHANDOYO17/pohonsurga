# Pemeriksaan otomatis setiap push / pull request:
# memastikan kode lolos TypeScript & bisa di-build sebelum Vercel men-deploy.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
      # Nilai palsu hanya untuk build; nilai asli diisi di Vercel.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy
      SUPABASE_SERVICE_ROLE_KEY: ci-dummy
      SESSION_SECRET: ci-dummy-secret-ci-dummy-secret-1234567890
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
